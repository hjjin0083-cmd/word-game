<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>실시간 끝말잇기 - 3D & 기믹 모드</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px; overflow: hidden; position: relative; }
        
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

        .container { 
            background: rgba(255, 255, 255, 0.93); 
            backdrop-filter: blur(8px);
            border-radius: 20px; 
            padding: 20px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12); 
            width: 100%; 
            max-width: 440px; 
            position: relative; 
            z-index: 10; 
        }

        h2 { font-size: 1.4rem; text-align: center; color: #0f172a; margin-bottom: 8px; font-weight: 700; }
        
        .stats-badge { background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 12px; padding: 8px 12px; font-size: 0.8rem; color: #3730a3; margin-bottom: 14px; text-align: center; font-weight: 600; }

        .form-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        input[type="text"] { width: 100%; padding: 14px 16px; font-size: 16px; border: 2px solid #e2e8f0; border-radius: 12px; outline: none; background: #ffffff; }
        input[type="text"]:focus { border-color: #6366f1; }
        button { width: 100%; padding: 14px; font-size: 16px; font-weight: 700; color: #ffffff; background-color: #6366f1; border: none; border-radius: 12px; cursor: pointer; }
        button:disabled { background-color: #cbd5e1; cursor: not-allowed; }

        .player-section { background: rgba(248, 250, 252, 0.8); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
        .player-header { font-size: 0.9rem; color: #64748b; font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .player-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .player-card { padding: 10px 12px; background: #ffffff; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 0.9rem; text-align: center; font-weight: 600; transition: all 0.3s ease; }
        
        .player-card.active-turn { 
            border-color: #6366f1; background-color: #eef2ff; color: #4338ca;
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: 600; }
        .combo-badge { background: #ffed4a; color: #854d0e; padding: 4px 10px; border-radius: 20px; font-weight: 800; font-size: 0.85rem; display: none; }
        .timer-badge { background-color: #fee2e2; color: #ef4444; padding: 6px 12px; border-radius: 20px; font-size: 0.9rem; }
        .timer-badge.bonus { background-color: #dcfce7; color: #15803d; }
        .timer-badge.danger { animation: shake 0.5s infinite; background-color: #ef4444; color: white; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } 100% { transform: translateX(0); } }

        .word-card { background: linear-gradient(135deg, #6366f1, #4f46e5); color: #ffffff; border-radius: 16px; padding: 16px; text-align: center; margin-bottom: 12px; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
        .word-card .label { font-size: 0.8rem; opacity: 0.8; margin-bottom: 4px; }
        .word-card .word { font-size: 2.2rem; font-weight: 800; }

        .item-container { display: flex; gap: 8px; margin-bottom: 12px; }
        .item-btn { flex: 1; padding: 8px; font-size: 0.8rem; background: #e0e7ff; color: #3730a3; border: 1px dashed #6366f1; border-radius: 10px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .item-btn:hover { background: #c7d2fe; }

        #word-history { height: 130px; overflow-y: auto; background: rgba(248, 250, 252, 0.8); border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
        .history-msg { font-size: 0.88rem; padding: 6px 10px; border-radius: 8px; background: #ffffff; border: 1px solid #f1f5f9; width: fit-content; max-width: 90%; }
        .history-msg.system { background: #e2e8f0; color: #475569; align-self: center; }

        .input-group { display: flex; gap: 8px; }
        .input-group input { flex: 1; margin-bottom: 0; }
        .input-group button { width: 80px; }
        .status-text { font-size: 0.85rem; color: #6366f1; text-align: center; margin-top: 8px; font-weight: 600; min-height: 1.2em; }
        .hidden { display: none !important; }

        .reaction {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 4.5rem; z-index: 100;
            pointer-events: none; opacity: 0;
            animation: popOut 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            text-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        @keyframes popOut {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            30% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            70% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -100%) scale(0.8); opacity: 0; }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="container" id="main-container">
        <h2>🎮 실시간 끝말잇기</h2>
        
        <div class="stats-badge" id="my-stats">🏆 전적: 0승 0패 | 최고 기록 단어: 없음</div>

        <div id="lobby">
            <div class="form-group">
                <input type="text" id="roomId" placeholder="방 번호 입력" value="room1">
                <input type="text" id="nickname" placeholder="닉네임 입력">
                <button onclick="joinRoom()">👥 다른 사람과 같이하기</button>
                <button onclick="startBotGame()" style="background-color: #10b981; margin-top: 6px;">🤖 컴퓨터와 대결하기</button>
            </div>
        </div>

        <div id="game-area" class="hidden">
            <div class="player-section">
                <div class="player-header">
                    <span>참가자 목록</span>
                    <span><strong id="player-count">0</strong>/4 명</span>
                </div>
                <div class="player-grid" id="players"></div>
                <button id="start-btn" onclick="requestStartGame()" class="hidden" style="margin-top: 10px;" disabled>대기 중...</button>
            </div>

            <div id="game-play" class="hidden">
                <div class="status-bar">
                    <div id="combo-box" class="combo-badge">🔥 <span id="combo-count">0</span> COMBO!</div>
                    <div id="timer-box" class="timer-badge">⏳ <span id="time-left">20</span>초</div>
                </div>

                <div class="word-card">
                    <div class="label">현재 제시어</div>
                    <div class="word" id="current-word">준비!</div>
                </div>

                <div class="item-container" id="item-slots">
                    <button class="item-btn" disabled>보유 아이템 없음</button>
                </div>

                <div id="word-history"></div>

                <div class="input-group">
                    <input type="text" id="word-input" placeholder="단어 입력..." disabled>
                    <button id="submit-btn" onclick="submitWord()" disabled>입력</button>
                </div>
                <div class="status-text" id="status-msg"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // 1. 소켓 객체 우선 선언
        const socket = io();
        let mySocketId = '';
        let currentRoomId = '';
        let currentTurnSocketId = '';
        let myItems = [];

        // 효과음 객체
        const sndSuccess = new Audio('https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg');
        const sndMyTurn = new Audio('https://actions.google.com/sounds/v1/water/water_drop.ogg');
        const sndError = new Audio('https://actions.google.com/sounds/v1/alarms/buzzer_alarm.ogg');
        const sndGameOver = new Audio('https://actions.google.com/sounds/v1/human_voices/crowd_cheer.ogg');

        // Three.js 배경 애니메이션
        let scene, camera, renderer;
        const wordBlocks = [];

        function init3DBackground() {
            const canvas = document.getElementById('bg-canvas');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0xf1f5f9, 0.018);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 30;

            renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x6366f1, 1.2);
            dirLight.position.set(15, 20, 10);
            scene.add(dirLight);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            animate3D();
        }

        function createWordTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#6366f1'; ctx.fillRect(0, 0, 512, 256);
            ctx.lineWidth = 16; ctx.strokeStyle = '#818cf8'; ctx.strokeRect(8, 8, 496, 240);
            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 84px -apple-system, sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(text, 256, 128);
            return new THREE.CanvasTexture(canvas);
        }

        function add3DWordBlock(word) {
            const texture = createWordTexture(word);
            const geometry = new THREE.BoxGeometry(7, 3.5, 1.2);
            const faceMat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.3 });
            const sideMat = new THREE.MeshStandardMaterial({ color: 0x4f46e5 });
            const materials = [sideMat, sideMat, sideMat, sideMat, faceMat, faceMat];

            const mesh = new THREE.Mesh(geometry, materials);
            mesh.position.x = (Math.random() - 0.5) * 35;
            mesh.position.y = -22;
            mesh.position.z = (Math.random() - 0.5) * 18 - 5;
            mesh.userData = { vy: 0.04 + Math.random() * 0.03, rotX: (Math.random() - 0.5) * 0.02, rotY: (Math.random() - 0.5) * 0.02 };

            scene.add(mesh);
            wordBlocks.push(mesh);
            if (wordBlocks.length > 20) scene.remove(wordBlocks.shift());
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            wordBlocks.forEach(mesh => {
                mesh.position.y += mesh.userData.vy;
                mesh.rotation.x += mesh.userData.rotX;
                mesh.rotation.y += mesh.userData.rotY;
                if (mesh.position.y > 22) mesh.position.y = -22;
            });
            renderer.render(scene, camera);
        }

        init3DBackground();
        loadLocalStats();

        function loadLocalStats() {
            const wins = localStorage.getItem('word_wins') || 0;
            const losses = localStorage.getItem('word_losses') || 0;
            const longest = localStorage.getItem('word_longest') || '없음';
            document.getElementById('my-stats').innerText = `🏆 전적: ${wins}승 ${losses}패 | 🔤 최고 기록 단어: ${longest}`;
        }

        function saveGameResult(isWin, usedLongestWord = '') {
            if (isWin) {
                let wins = parseInt(localStorage.getItem('word_wins') || 0) + 1;
                localStorage.setItem('word_wins', wins);
            } else {
                let losses = parseInt(localStorage.getItem('word_losses') || 0) + 1;
                localStorage.setItem('word_losses', losses);
            }

            if (usedLongestWord) {
                let currentLongest = localStorage.getItem('word_longest') || '';
                if (usedLongestWord.length > currentLongest.length) {
                    localStorage.setItem('word_longest', usedLongestWord);
                }
            }
            loadLocalStats();
        }

        socket.on('connect', () => { mySocketId = socket.id; });

// 사람 대결 입장
function joinRoom() {
    const roomId = document.getElementById('roomId').value.trim();
    const nickname = document.getElementById('nickname').value.trim();
    if (!roomId || !nickname) return alert('방 번호와 닉네임을 입력하세요.');

    unlockAudio();
    currentRoomId = roomId;
    socket.emit('join_room', { roomId, nickname });
    
    // 로비 숨기고 게임 영역 표시
    document.getElementById('lobby').classList.add('hidden');
    document.getElementById('game-area').classList.remove('hidden');
    
    // 대기 안내 메시지 설정
    document.getElementById('status-msg').innerText = "⏳ 다른 플레이어를 기다리는 중입니다...";
}

        // 컴퓨터 대결 시작
        function startBotGame() {
            const roomId = document.getElementById('roomId').value.trim() || 'bot-room';
            const nickname = document.getElementById('nickname').value.trim();
            if (!nickname) return alert('닉네임을 입력해주세요.');

            unlockAudio();
            currentRoomId = roomId;
            socket.emit('start_bot_game', { roomId, nickname });

            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('game-area').classList.remove('hidden');
            document.getElementById('game-play').classList.remove('hidden');
        }

        function unlockAudio() {
            [sndSuccess, sndMyTurn, sndError, sndGameOver].forEach(snd => {
                const p = snd.play();
                if (p !== undefined) p.then(() => { snd.pause(); snd.currentTime = 0; }).catch(() => {});
            });
        }

        function requestStartGame() {
            socket.emit('start_game', { roomId: currentRoomId });
        }

   // 방 플레이어 정보 수신
socket.on('room_update', ({ players, isStarted }) => {
    document.getElementById('player-count').innerText = players.length;
    renderPlayers(players);

    // 💡 [핵심 수정] 게임이 이미 진행 중이라면 대기실 UI(시작 버튼, 대기 메시지) 덮어쓰기를 중단합니다!
    if (isStarted) return;

    const startBtn = document.getElementById('start-btn');
    const isHost = players.length > 0 && players[0].id === socket.id;
    
    // 멀티플레이어 대기실 처리
    if (!players.some(p => p.isBot)) {
        if (isHost) {
            startBtn.classList.remove('hidden');
            startBtn.disabled = players.length < 2;
            startBtn.innerText = players.length >= 2 ? "🚀 게임 시작하기!" : "2명 이상 대기 중...";
        } else {
            startBtn.classList.add('hidden');
            document.getElementById('status-msg').innerText = "방장이 게임을 시작할 때까지 대기해주세요.";
        }
    }
});
 
// 게임 시작 수신 (핵심: 모든 플레이어의 단어 입력 판 열기)
socket.on('game_start', ({ players, currentTurnSocketId: turnId, currentTurnNickname }) => {
    document.getElementById('start-btn').classList.add('hidden');
    
    // 🔥 모든 참가자의 단어 입력창 및 게임 플레이 화면을 즉시 표시
    document.getElementById('game-play').classList.remove('hidden');
    
    currentTurnSocketId = turnId;
    updateTurnUI(currentTurnNickname);
    renderPlayers(players);
    showReaction('🔥');
});

// 게임 시작 수신
socket.on('game_start', ({ players, currentTurnSocketId: turnId, currentTurnNickname }) => {
    document.getElementById('start-btn').classList.add('hidden');
    // 핵심: 모든 플레이어의 게임 플레이 화면을 활성화!
    document.getElementById('game-play').classList.remove('hidden');
    
    currentTurnSocketId = turnId;
    updateTurnUI(currentTurnNickname);
    renderPlayers(players);
    showReaction('🔥');
});

        function renderPlayers(players) {
            const grid = document.getElementById('players');
            grid.innerHTML = players.map(p => {
                const isMe = p.id === socket.id ? ' (나)' : '';
                const isTurn = p.id === currentTurnSocketId ? ' active-turn' : '';
                return `<div class="player-card${isTurn}">${p.nickname}${isMe}</div>`;
            }).join('');
        }

        
        // 턴 변경 수신
        socket.on('turn_changed', ({ currentTurnSocketId: turnId, currentTurnNickname, lastWord, message, combo }) => {
            if (message) appendHistory(message, 'system');
            if (lastWord) document.getElementById('current-word').innerText = lastWord;

            currentTurnSocketId = turnId;
            updateTurnUI(currentTurnNickname);
            socket.emit('get_room_info', { roomId: currentRoomId });
        });

        // 단어 수락 수신
        socket.on('word_accepted', ({ word, nickname, combo, earnedItem, myItems: updatedItems, socketId }) => {
            appendHistory(`✅ ${nickname}: ${word}`);
            document.getElementById('current-word').innerText = word;
            document.getElementById('word-input').value = '';

            const comboBox = document.getElementById('combo-box');
            if (combo > 1) {
                comboBox.style.display = 'block';
                document.getElementById('combo-count').innerText = combo;
                sndSuccess.playbackRate = Math.min(1.0 + (combo * 0.15), 2.0); 
            } else {
                comboBox.style.display = 'none';
                sndSuccess.playbackRate = 1.0;
            }

            sndSuccess.play();
            showReaction(combo > 2 ? '⚡' : '✨'); 
            add3DWordBlock(word);
            saveGameResult(false, word);

            if (socketId === socket.id && updatedItems) {
                myItems = updatedItems;
                renderItemSlots();
                if (earnedItem) {
                    appendHistory(`🎁 아이템 획득! [${earnedItem === 'SKIP' ? '턴 건너뛰기' : '제시어 변경'}]`, 'system');
                }
            }
        });

        function renderItemSlots() {
            const container = document.getElementById('item-slots');
            if (myItems.length === 0) {
                container.innerHTML = `<button class="item-btn" disabled>보유 아이템 없음</button>`;
                return;
            }
            container.innerHTML = myItems.map(item => {
                const label = item === 'SKIP' ? '⚡ 턴 건너뛰기' : '🎲 제시어 변경';
                return `<button class="item-btn" onclick="useItem('${item}')">${label}</button>`;
            }).join('');
        }

        function useItem(itemType) {
            if (currentTurnSocketId !== socket.id) return alert('본인 턴에만 아이템을 사용할 수 있습니다.');
            socket.emit('use_item', { roomId: currentRoomId, itemType });
        }

        socket.on('update_my_items', ({ items }) => {
            myItems = items;
            renderItemSlots();
        });

        socket.on('item_used', ({ nickname, message, newWord }) => {
            appendHistory(message, 'system');
            showReaction('🪄');
            if (newWord) document.getElementById('current-word').innerText = newWord;
        });

        socket.on('timer_update', ({ timeLeft, bonusTime, currentPlayerId }) => {
            document.getElementById('time-left').innerText = timeLeft;
            const timerBox = document.getElementById('timer-box');
            
            if (bonusTime > 0 && currentPlayerId === socket.id) {
                timerBox.classList.add('bonus');
                appendHistory(`⏳ 보너스 시간 +${bonusTime}초 적용!`, 'system');
            } else {
                timerBox.classList.remove('bonus');
            }

            if (timeLeft <= 3) {
                timerBox.classList.add('danger');
            } else {
                timerBox.classList.remove('danger');
            }
        });

        socket.on('error_msg', (msg) => {
            sndError.play();
            showReaction('❌');
            const status = document.getElementById('status-msg');
            status.style.color = "red";
            status.innerText = msg;
            setTimeout(() => {
                if (currentTurnSocketId === socket.id) {
                    status.style.color = "#6366f1";
                    status.innerText = "🎯 당신의 턴입니다!";
                }
            }, 2000);
        });

        socket.on('game_over', ({ winner }) => {
            sndGameOver.play();
            showReaction('🏆');
            
            const myNickname = document.getElementById('nickname').value.trim();
            const isWin = winner.includes(myNickname);
            saveGameResult(isWin);

            setTimeout(() => {
                alert(`게임 종료! 최종 승자: ${winner} 🎉`);
                location.reload();
            }, 1200);
        });

        function updateTurnUI(turnNickname) {
            const isMyTurn = currentTurnSocketId === socket.id;
            document.getElementById('word-input').disabled = !isMyTurn;
            document.getElementById('submit-btn').disabled = !isMyTurn;

            const status = document.getElementById('status-msg');
            status.style.color = "#6366f1";

            if (isMyTurn) {
                status.innerText = "🎯 당신의 턴입니다!";
                document.getElementById('word-input').focus();
                sndMyTurn.play();
            } else {
                status.innerText = `⏳ ${turnNickname} 님의 순서입니다...`;
            }
        }

        function submitWord() {
            const input = document.getElementById('word-input');
            const word = input.value.trim();
            if (word) {
                socket.emit('submit_word', { roomId: currentRoomId, word });
            }
        }

        function appendHistory(msg, type = 'user') {
            const history = document.getElementById('word-history');
            const div = document.createElement('div');
            div.className = `history-msg ${type}`;
            div.innerText = msg;
            history.appendChild(div);
            history.scrollTop = history.scrollHeight;
        }

        document.getElementById('word-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitWord();
        });

        function showReaction(emoji) {
            const container = document.getElementById('main-container');
            const reaction = document.createElement('div');
            reaction.className = 'reaction';
            reaction.innerText = emoji;
            container.appendChild(reaction);

            setTimeout(() => reaction.remove(), 1000);
        }
    </script>
</body>
</html>
