<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>실시간 끝말잇기 - 피버 & 기믹 익스트림</title>
    <!-- 폭죽 연출 라이브러리 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px; overflow: hidden; position: relative; }
        
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

        .container { 
            background: rgba(255, 255, 255, 0.93); 
            backdrop-filter: blur(10px);
            border-radius: 20px; 
            padding: 20px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12); 
            width: 100%; 
            max-width: 440px; 
            position: relative; 
            z-index: 10; 
            transition: border 0.3s ease, box-shadow 0.3s ease;
        }

        /* 🔥 피버 모드 스타일 */
        .container.fever-mode {
            border: 3px solid #ff007f;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.6), inset 0 0 15px rgba(255, 0, 127, 0.3);
            animation: feverGlow 1s infinite alternate;
        }
        @keyframes feverGlow {
            from { border-color: #ff007f; box-shadow: 0 0 20px #ff007f; }
            to { border-color: #7928ca; box-shadow: 0 0 30px #7928ca; }
        }

        /* 💥 화면 흔들림 효과 */
        .shake-effect {
            animation: shakeHard 0.25s ease-in-out;
        }
        @keyframes shakeHard {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-6px, 4px); }
            50% { transform: translate(6px, -4px); }
            75% { transform: translate(-4px, -2px); }
            100% { transform: translate(0, 0); }
        }

        h2 { font-size: 1.4rem; text-align: center; color: #0f172a; margin-bottom: 8px; font-weight: 800; }
        
        .stats-badge { background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 12px; padding: 8px 12px; font-size: 0.8rem; color: #3730a3; margin-bottom: 12px; text-align: center; font-weight: 600; }

        /* 🎯 돌발 미션 배너 */
        .mission-banner {
            background: linear-gradient(90deg, #fff7ed, #ffedd5);
            border: 1px solid #fed7aa;
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 0.82rem;
            color: #c2410c;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .form-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        input[type="text"] { width: 100%; padding: 14px 16px; font-size: 16px; border: 2px solid #e2e8f0; border-radius: 12px; outline: none; background: #ffffff; }
        input[type="text"]:focus { border-color: #6366f1; }
        button { width: 100%; padding: 14px; font-size: 16px; font-weight: 700; color: #ffffff; background-color: #6366f1; border: none; border-radius: 12px; cursor: pointer; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        button:disabled { background-color: #cbd5e1; cursor: not-allowed; }

        .player-section { background: rgba(248, 250, 252, 0.8); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
        .player-header { font-size: 0.9rem; color: #64748b; font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .player-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .player-card { padding: 10px 12px; background: #ffffff; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 0.9rem; text-align: center; font-weight: 600; transition: all 0.3s ease; }
        
        .player-card.active-turn { 
            border-color: #6366f1; background-color: #eef2ff; color: #4338ca;
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }

        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: 600; }
        .combo-badge { background: #ffed4a; color: #854d0e; padding: 4px 10px; border-radius: 20px; font-weight: 800; font-size: 0.85rem; display: none; }
        .timer-badge { background-color: #fee2e2; color: #ef4444; padding: 6px 12px; border-radius: 20px; font-size: 0.9rem; }
        .timer-badge.bonus { background-color: #dcfce7; color: #15803d; }
        .timer-badge.danger { animation: shake 0.5s infinite; background-color: #ef4444; color: white; }

        .word-card { background: linear-gradient(135deg, #6366f1, #4f46e5); color: #ffffff; border-radius: 16px; padding: 16px; text-align: center; margin-bottom: 12px; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
        .word-card .label { font-size: 0.8rem; opacity: 0.8; margin-bottom: 4px; }
        .word-card .word { font-size: 2.2rem; font-weight: 800; }

        .item-container { display: flex; gap: 8px; margin-bottom: 12px; }
        .item-btn { flex: 1; padding: 8px; font-size: 0.8rem; background: #e0e7ff; color: #3730a3; border: 1px dashed #6366f1; border-radius: 10px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .item-btn:hover { background: #c7d2fe; }

        #word-history { height: 100px; overflow-y: auto; background: rgba(248, 250, 252, 0.8); border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
        .history-msg { font-size: 0.88rem; padding: 6px 10px; border-radius: 8px; background: #ffffff; border: 1px solid #f1f5f9; width: fit-content; max-width: 90%; }
        .history-msg.system { background: #e2e8f0; color: #475569; align-self: center; }

        .input-group { display: flex; gap: 8px; }
        .input-group input { flex: 1; margin-bottom: 0; }
        .input-group button { width: 80px; }
        .status-text { font-size: 0.85rem; color: #6366f1; text-align: center; margin-top: 8px; font-weight: 600; min-height: 1.2em; }
        .hidden { display: none !important; }

        .reaction {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 4.5rem; z-index: 100;
            pointer-events: none; opacity: 0;
            animation: popOut 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            text-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        @keyframes popOut {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            30% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            70% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -100%) scale(0.8); opacity: 0; }
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal-card {
            background: #ffffff; border-radius: 20px; padding: 24px;
            width: 88%; max-width: 340px; text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            animation: modalUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes modalUp {
            from { transform: translateY(20px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        .modal-card h3 { font-size: 1.3rem; margin-bottom: 8px; color: #0f172a; }
        .modal-card p { font-size: 1rem; color: #475569; margin-bottom: 20px; font-weight: 600; }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btns button { flex: 1; font-size: 0.95rem; padding: 12px; }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="container" id="main-container">
        <h2>🎮 실시간 끝말잇기</h2>
        
        <div class="stats-badge" id="my-stats">🏆 전적: 0승 0패 | 최고 기록 단어: 없음</div>

        <div id="lobby">
            <div style="background: rgba(248, 250, 252, 0.9); border-radius: 12px; padding: 12px; margin-bottom: 12px; border: 1px solid #e2e8f0;">
                <h3 style="font-size: 0.9rem; color: #475569; margin-bottom: 8px;">🟢 현재 대기 중인 방</h3>
                <div id="public-rooms" style="display: flex; flex-direction: column; gap: 8px; max-height: 150px; overflow-y: auto;">
                    <div style="font-size: 0.85rem; color: #94a3b8; text-align: center; padding: 10px;">대기 중인 방이 없습니다.</div>
                </div>
            </div>

            <div class="form-group">
                <input type="text" id="roomId" placeholder="새 방 만들기 (방 이름 입력)" value="room1">
                <input type="text" id="nickname" placeholder="닉네임 입력">
                <button onclick="joinRoom()">👥 방 들어가기 / 만들기</button>
                <button onclick="startBotGame()" style="background-color: #10b981; margin-top: 6px;">🤖 컴퓨터와 대결하기</button>
            </div>
        </div>

        <div id="game-area" class="hidden">
            <div class="player-section">
                <div class="player-header">
                    <span>참가자 목록</span>
                    <span><strong id="player-count">0</strong>/4 명</span>
                </div>
                <div class="player-grid" id="players"></div>
                <button id="start-btn" onclick="requestStartGame()" class="hidden" style="margin-top: 10px;" disabled>대기 중...</button>
            </div>

            <div id="game-play" class="hidden">
                <!-- 🎯 돌발 미션 표시 -->
                <div class="mission-banner" id="mission-box">
                    🎯 [돌발 미션] '<span id="mission-char">바</span>' 포함 단어 입력 시 아이템 획득!
                </div>

                <div class="status-bar">
                    <div id="combo-box" class="combo-badge">🔥 <span id="combo-count">0</span> COMBO!</div>
                    <div id="timer-box" class="timer-badge">⏳ <span id="time-left">20</span>초</div>
                </div>

                <div class="word-card">
                    <div class="label">현재 제시어</div>
                    <div class="word" id="current-word">준비!</div>
                </div>

                <div class="item-container" id="item-slots">
                    <button class="item-btn" disabled>보유 아이템 없음</button>
                </div>

                <div style="margin-bottom: 8px; display: flex; gap: 8px;">
                    <button class="item-btn" style="background: #fef3c7; color: #92400e; border-color: #f59e0b;" onclick="requestHint()">💡 단어 힌트 보기</button>
                </div>
                <div id="word-definition" style="font-size: 0.82rem; color: #475569; background: #f8fafc; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; min-height: 2em; border: 1px solid #e2e8f0;">
                    📖 단어의 뜻이 여기에 표시됩니다.
                </div>

                <div id="word-history"></div>

                <div class="input-group">
                    <input type="text" id="word-input" placeholder="단어 입력..." disabled>
                    <button id="submit-btn" onclick="submitWord()" disabled>입력</button>
                </div>
                <div class="status-text" id="status-msg"></div>
            </div>
        </div>
    </div>

    <!-- 결과 팝업 모달 -->
    <div id="game-over-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>🏆 게임 종료!</h3>
            <p id="game-over-winner">최종 승자: 알 수 없음</p>
            <div class="modal-btns">
                <button onclick="rematchGame()" style="background-color: #10b981;">🔄 재대결하기</button>
                <button onclick="leaveRoom()" style="background-color: #ef4444;">🚪 방 나가기</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // HTML 특수문자 이스케이프 (XSS 방지)
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        const bgm = new Audio('https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3');
        bgm.loop = true;   
        bgm.volume = 0.2;  

        const socket = io();
        let mySocketId = '';
        let currentRoomId = '';
        let currentTurnSocketId = '';
        let myItems = [];
        let isBotGame = false;
        let currentMissionChar = '바';

        const missionChars = ['바', '가', '나', '마', '라', '자', '사', '하', '구', '수'];

        const sndSuccess = new Audio('https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg');
        const sndMyTurn = new Audio('https://actions.google.com/sounds/v1/water/water_drop.ogg');
        const sndError = new Audio('https://actions.google.com/sounds/v1/alarms/buzzer_alarm.ogg');
        const sndGameOver = new Audio('https://actions.google.com/sounds/v1/human_voices/crowd_cheer.ogg');

        let scene, camera, renderer;
        const wordBlocks = [];

        function init3DBackground() {
            const canvas = document.getElementById('bg-canvas');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0xf1f5f9, 0.018);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 30;

            renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x6366f1, 1.2);
            dirLight.position.set(15, 20, 10);
            scene.add(dirLight);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            animate3D();
        }

        function createWordTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#6366f1'; ctx.fillRect(0, 0, 512, 256);
            ctx.lineWidth = 16; ctx.strokeStyle = '#818cf8'; ctx.strokeRect(8, 8, 496, 240);
            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 84px -apple-system, sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(text, 256, 128);
            return new THREE.CanvasTexture(canvas);
        }

        function add3DWordBlock(word) {
            const texture = createWordTexture(word);
            const geometry = new THREE.BoxGeometry(7, 3.5, 1.2);
            const faceMat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.3 });
            const sideMat = new THREE.MeshStandardMaterial({ color: 0x4f46e5 });
            const materials = [sideMat, sideMat, sideMat, sideMat, faceMat, faceMat];

            const mesh = new THREE.Mesh(geometry, materials);
            mesh.position.x = (Math.random() - 0.5) * 35;
            mesh.position.y = -22;
            mesh.position.z = (Math.random() - 0.5) * 18 - 5;
            mesh.userData = { vy: 0.04 + Math.random() * 0.03, rotX: (Math.random() - 0.5) * 0.02, rotY: (Math.random() - 0.5) * 0.02 };

            scene.add(mesh);
            wordBlocks.push(mesh);

            // GPU 메모리 누수 방지 리소스 해제
            if (wordBlocks.length > 20) {
                const oldMesh = wordBlocks.shift();
                scene.remove(oldMesh);
                oldMesh.geometry.dispose();
                if (Array.isArray(oldMesh.material)) {
                    oldMesh.material.forEach(mat => {
                        if (mat.map) mat.map.dispose();
                        mat.dispose();
                    });
                }
            }
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            wordBlocks.forEach(mesh => {
                mesh.position.y += mesh.userData.vy;
                mesh.rotation.x += mesh.userData.rotX;
                mesh.rotation.y += mesh.userData.rotY;
                if (mesh.position.y > 22) mesh.position.y = -22;
            });
            renderer.render(scene, camera);
        }

        init3DBackground();
        loadLocalStats();

        function loadLocalStats() {
            const wins = localStorage.getItem('word_wins') || 0;
            const losses = localStorage.getItem('word_losses') || 0;
            const longest = localStorage.getItem('word_longest') || '없음';
            document.getElementById('my-stats').innerText = `🏆 전적: ${wins}승 ${losses}패 | 🔤 최고 기록 단어: ${longest}`;
        }

        function updateLongestWord(word) {
            if (!word) return;
            let currentLongest = localStorage.getItem('word_longest') || '';
            if (word.length > currentLongest.length) {
                localStorage.setItem('word_longest', word);
                loadLocalStats();
            }
        }

        function saveGameResult(isWin) {
            if (isWin) {
                let wins = parseInt(localStorage.getItem('word_wins') || 0) + 1;
                localStorage.setItem('word_wins', wins);
            } else {
                let losses = parseInt(localStorage.getItem('word_losses') || 0) + 1;
                localStorage.setItem('word_losses', losses);
            }
            loadLocalStats();
        }

        function triggerShake() {
            const container = document.getElementById('main-container');
            container.classList.add('shake-effect');
            setTimeout(() => container.classList.remove('shake-effect'), 250);
        }

        function refreshMission() {
            currentMissionChar = missionChars[Math.floor(Math.random() * missionChars.length)];
            document.getElementById('mission-char').innerText = currentMissionChar;
        }

        socket.on('connect', () => { mySocketId = socket.id; });

        socket.on('room_list', (rooms) => {
            const container = document.getElementById('public-rooms');
            if (!container) return;

            if (rooms.length === 0) {
                container.innerHTML = '<div style="font-size: 0.85rem; color: #94a3b8; text-align: center; padding: 10px;">대기 중인 방이 없습니다.<br>아래에서 새 방을 만들어보세요!</div>';
                return;
            }

            container.innerHTML = rooms.map(room => {
                const safeRoomId = escapeHtml(room.roomId);
                return `<button onclick="quickJoin('${safeRoomId}')" style="background: #eef2ff; color: #4338ca; border: 1px solid #c7d2fe; border-radius: 8px; padding: 10px 14px; font-size: 0.9rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: all 0.2s; margin-bottom: 5px;">
                    <span>🚪 ${safeRoomId}</span>
                    <span style="background: #ffffff; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; border: 1px solid #a5b4fc;">👥 ${room.playerCount} / 4 명</span>
                </button>`;
            }).join('');
        });

        function quickJoin(roomId) {
            document.getElementById('roomId').value = roomId;
            document.getElementById('nickname').focus(); 
        }

        function joinRoom() {
            isBotGame = false;
            const roomId = document.getElementById('roomId').value.trim();
            const nickname = document.getElementById('nickname').value.trim();
            if (!roomId || !nickname) return alert('방 번호와 닉네임을 입력하세요.');

            bgm.play().catch(error => console.log('재생 에러:', error));
            unlockAudio();
            currentRoomId = roomId;
            socket.emit('join_room', { roomId, nickname });
            
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('game-area').classList.remove('hidden');
            document.getElementById('status-msg').innerText = "⏳ 다른 플레이어를 기다리는 중입니다...";
        }

        function startBotGame() {
            isBotGame = true;
            const roomId = document.getElementById('roomId').value.trim() || 'bot-room';
            const nickname = document.getElementById('nickname').value.trim();
            if (!nickname) return alert('닉네임을 입력해주세요.');

            bgm.play().catch(error => console.log('재생 에러:', error));
            unlockAudio();
            currentRoomId = roomId;
            socket.emit('start_bot_game', { roomId, nickname });

            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('game-area').classList.remove('hidden');
            document.getElementById('game-play').classList.remove('hidden');
            refreshMission();
        }

        function unlockAudio() {
            [sndSuccess, sndMyTurn, sndError, sndGameOver].forEach(snd => {
                const p = snd.play();
                if (p !== undefined) p.then(() => { snd.pause(); snd.currentTime = 0; }).catch(() => {});
            });
        }

        function requestStartGame() {
            socket.emit('start_game', { roomId: currentRoomId });
        }

        socket.on('room_update', ({ players, isStarted }) => {
            document.getElementById('player-count').innerText = players.length;
            renderPlayers(players);

            if (isStarted) return;

            const startBtn = document.getElementById('start-btn');
            const isHost = players.length > 0 && players[0].id === socket.id;
            
            if (!players.some(p => p.isBot)) {
                if (isHost) {
                    startBtn.classList.remove('hidden');
                    startBtn.disabled = players.length < 2;
                    startBtn.innerText = players.length >= 2 ? "🚀 게임 시작하기!" : "2명 이상 대기 중...";
                } else {
                    startBtn.classList.add('hidden');
                    document.getElementById('status-msg').innerText = "방장이 게임을 시작할 때까지 대기해주세요.";
                }
            }
        });

        socket.on('game_start', ({ players, currentTurnSocketId: turnId, currentTurnNickname }) => {
            document.getElementById('start-btn').classList.add('hidden');
            document.getElementById('game-play').classList.remove('hidden');
            
            currentTurnSocketId = turnId;
            updateTurnUI(currentTurnNickname);
            renderPlayers(players);
            refreshMission();
            showReaction('🔥');
        });

        function renderPlayers(players) {
            const grid = document.getElementById('players');
            grid.innerHTML = players.map(p => {
                const safeName = escapeHtml(p.nickname);
                const isMe = p.id === socket.id ? ' (나)' : '';
                const isTurn = p.id === currentTurnSocketId ? ' active-turn' : '';
                return `<div class="player-card${isTurn}">${safeName}${isMe}</div>`;
            }).join('');
        }
        
        socket.on('turn_changed', ({ currentTurnSocketId: turnId, currentTurnNickname, lastWord, message, combo }) => {
            if (message) appendHistory(message, 'system');
            if (lastWord) document.getElementById('current-word').innerText = lastWord;

            currentTurnSocketId = turnId;
            updateTurnUI(currentTurnNickname);
            socket.emit('get_room_info', { roomId: currentRoomId });
        });

        socket.on('word_accepted', ({ word, nickname, definition, combo, earnedItem, myItems: updatedItems, socketId }) => {
            appendHistory(`✅ ${escapeHtml(nickname)}: ${word}`);
            document.getElementById('current-word').innerText = word;
            document.getElementById('word-input').value = '';

            if (definition) {
                document.getElementById('word-definition').innerHTML = `<strong>[${word}]</strong> ${escapeHtml(definition)}`;
            }

            // 🔥 피버 모드 및 콤보 연출
            const container = document.getElementById('main-container');
            const comboBox = document.getElementById('combo-box');
            if (combo >= 3) {
                container.classList.add('fever-mode');
            } else {
                container.classList.remove('fever-mode');
            }

            if (combo > 1) {
                comboBox.style.display = 'block';
                document.getElementById('combo-count').innerText = combo;
                sndSuccess.playbackRate = Math.min(1.0 + (combo * 0.15), 2.0); 
            } else {
                comboBox.style.display = 'none';
                sndSuccess.playbackRate = 1.0;
            }

            // 🎯 돌발 미션 단어 성공 확인
            if (word.includes(currentMissionChar)) {
                showReaction('🎯');
                appendHistory(`🎯 미션 성공! '${currentMissionChar}' 포함 단어 입력`, 'system');
                confetti({ particleCount: 40, spread: 60, origin: { y: 0.7 } });
                refreshMission();
            }

            sndSuccess.play();
            triggerShake();
            showReaction(combo > 2 ? '⚡' : '✨'); 
            add3DWordBlock(word);
            updateLongestWord(word);

            if (socketId === socket.id && updatedItems) {
                myItems = updatedItems;
                renderItemSlots();
                if (earnedItem) {
                    appendHistory(`🎁 아이템 획득! [${earnedItem}]`, 'system');
                }
            }
        });

        function requestHint() {
            if (currentTurnSocketId !== socket.id) {
                return alert('본인 턴에만 힌트를 사용할 수 있습니다!');
            }
            const currentWord = document.getElementById('current-word').innerText;
            const lastChar = currentWord.slice(-1);
            
            const status = document.getElementById('status-msg');
            status.style.color = "#d97706";
            status.innerText = `💡 [힌트] '${lastChar}'(또는 두음법칙 적용 글자)로 시작하는 단어를 입력해보세요!`;
        }

        function renderItemSlots() {
            const container = document.getElementById('item-slots');
            if (myItems.length === 0) {
                container.innerHTML = `<button class="item-btn" disabled>보유 아이템 없음</button>`;
                return;
            }
            container.innerHTML = myItems.map(item => {
                let label = '🎲 아이템';
                if (item === 'SKIP') label = '⚡ 턴 건너뛰기';
                else if (item === 'CHANGE') label = '🎲 제시어 변경';
                else if (item === 'ATTACK') label = '⏱️ 시간 차감 (-5초)';
                return `<button class="item-btn" onclick="useItem('${item}')">${label}</button>`;
            }).join('');
        }

        function useItem(itemType) {
            if (currentTurnSocketId !== socket.id) return alert('본인 턴에만 아이템을 사용할 수 있습니다.');
            socket.emit('use_item', { roomId: currentRoomId, itemType });
        }

        socket.on('update_my_items', ({ items }) => {
            myItems = items;
            renderItemSlots();
        });

        socket.on('item_used', ({ nickname, message, newWord }) => {
            appendHistory(message, 'system');
            triggerShake();
            showReaction('🪄');
            if (newWord) document.getElementById('current-word').innerText = newWord;
        });

        socket.on('timer_update', ({ timeLeft, bonusTime, currentPlayerId }) => {
            document.getElementById('time-left').innerText = timeLeft;
            const timerBox = document.getElementById('timer-box');
            
            if (bonusTime > 0 && currentPlayerId === socket.id) {
                timerBox.classList.add('bonus');
                appendHistory(`⏳ 보너스 시간 +${bonusTime}초 적용!`, 'system');
            } else {
                timerBox.classList.remove('bonus');
            }

            if (timeLeft <= 3) {
                timerBox.classList.add('danger');
            } else {
                timerBox.classList.remove('danger');
            }
        });

        socket.on('error_msg', (msg) => {
            sndError.play();
            showReaction('❌');
            const status = document.getElementById('status-msg');
            status.style.color = "red";
            status.innerText = msg;
            setTimeout(() => {
                if (currentTurnSocketId === socket.id) {
                    status.style.color = "#6366f1";
                    status.innerText = "🎯 당신의 턴입니다!";
                }
            }, 2000);
        });

        // 🏆 게임 종료 시 승리 폭죽 연출
        socket.on('game_over', ({ winner }) => {
            sndGameOver.play();
            showReaction('🏆');
            
            // 승리 폭죽 세레머니
            confetti({
                particleCount: 100,
                spread: 80,
                origin: { y: 0.6 }
            });

            document.getElementById('main-container').classList.remove('fever-mode');
            
            const myNickname = document.getElementById('nickname').value.trim();
            const isWin = winner.includes(myNickname);
            saveGameResult(isWin);

            setTimeout(() => {
                document.getElementById('game-over-winner').innerText = `최종 승자: ${escapeHtml(winner)} 🎉`;
                document.getElementById('game-over-modal').classList.remove('hidden');
            }, 1200);
        });

        function rematchGame() {
            document.getElementById('game-over-modal').classList.add('hidden');
            
            // UI 초기화
            document.getElementById('word-history').innerHTML = '';
            document.getElementById('current-word').innerText = '준비!';
            document.getElementById('word-definition').innerHTML = '📖 단어의 뜻이 여기에 표시됩니다.';
            document.getElementById('word-input').value = '';
            document.getElementById('word-input').disabled = true;
            document.getElementById('submit-btn').disabled = true;
            document.getElementById('main-container').classList.remove('fever-mode');
            
            myItems = [];
            renderItemSlots();

            if (isBotGame) {
                const nickname = document.getElementById('nickname').value.trim();
                socket.emit('start_bot_game', { roomId: currentRoomId, nickname });
                refreshMission();
            } else {
                document.getElementById('game-play').classList.add('hidden');
                document.getElementById('status-msg').innerText = '대기실로 돌아왔습니다. 준비 후 시작해주세요!';
                socket.emit('get_room_info', { roomId: currentRoomId });
            }
        }

        function leaveRoom() {
            document.getElementById('game-over-modal').classList.add('hidden');
            socket.emit('leave_room');
            location.reload(); 
        }

        function updateTurnUI(turnNickname) {
            const isMyTurn = currentTurnSocketId === socket.id;
            document.getElementById('word-input').disabled = !isMyTurn;
            document.getElementById('submit-btn').disabled = !isMyTurn;

            const status = document.getElementById('status-msg');
            status.style.color = "#6366f1";

            if (isMyTurn) {
                status.innerText = "🎯 당신의 턴입니다!";
                document.getElementById('word-input').focus();
                sndMyTurn.play();
            } else {
                status.innerText = `⏳ ${escapeHtml(turnNickname)} 님의 순서입니다...`;
            }
        }

        function submitWord() {
            const input = document.getElementById('word-input');
            const word = input.value.trim();
            if (word) {
                socket.emit('submit_word', { roomId: currentRoomId, word });
            }
        }

        function appendHistory(msg, type = 'user') {
            const history = document.getElementById('word-history');
            const div = document.createElement('div');
            div.className = `history-msg ${type}`;
            div.innerText = msg;
            history.appendChild(div);
            history.scrollTop = history.scrollHeight;
        }

        document.getElementById('word-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitWord();
        });

        function showReaction(emoji) {
            const container = document.getElementById('main-container');
            const reaction = document.createElement('div');
            reaction.className = 'reaction';
            reaction.innerText = emoji;
            container.appendChild(reaction);

            setTimeout(() => reaction.remove(), 1000);
        }
    </script>
</body>
</html>
